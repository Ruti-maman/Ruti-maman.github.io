name: Deploy the portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The screenshot refresh commits with the workflow's own GITHUB_TOKEN, and
  # GitHub deliberately fires no push event for those (recursion guard) — so
  # without this, fresh screenshots landed in the repo but never on the site.
  workflow_run:
    workflows: ["Refresh project screenshots"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # One self-contained index.html plus the screenshots it points at.
      # Nothing to build.
      - run: touch .nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
