name: Verify the live previews

# Drives the published site and photographs the result. Runs on demand, on a
# runner, because the machine this repo is authored on cannot reach github.io
# at all - the office network blocks it.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      # pipefail, or `| tee` hands back its own exit code and a crashed run
      # reports green. The result is recorded and re-raised after the commit,
      # so a failure still leaves its screenshots behind to look at.
      - name: Drive the published site
        id: drive
        run: |
          set -o pipefail
          node tools/verify-site.js  2>&1 | tee    verify.log && c1=0 || c1=$?
          node tools/verify-demos.js 2>&1 | tee -a verify.log && c2=0 || c2=$?
          code=0; [ "${c1:-1}" -ne 0 ] && code=1; [ "${c2:-1}" -ne 0 ] && code=1
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "site=$c1 demos=$c2 -> $code"

      - name: Commit the evidence
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p verify
          mv verify.log verify/
          git add verify
          git diff --staged --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "test(verify): capture live-preview run"
          git push

      - name: Fail the run if any check failed
        if: always() && steps.drive.outputs.code != '0'
        run: |
          echo "verify-site.js reported failures - see verify/verify.log"
          exit 1
