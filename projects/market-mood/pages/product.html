            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #000;
            min-height: 100vh;
            direction: rtl;
        }

        /* Site Header Navigation */
        .site-header {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(15px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            z-index: 500;
            padding: 15px 25px;
            border-radius: 20px;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: white;
            color: #5ec4bd;
            padding: 12px 24px;
            border-radius: 15px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s;
            border: 2px solid #e0f9f5;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(94, 196, 189, 0.1);
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, #e0f9f5 0%, #c5f3ec 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(94, 196, 189, 0.25);
            border-color: #5ec4bd;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #5ec4bd 0%, #4eb5ad 100%);
            color: white;
            border-color: #5ec4bd;
            box-shadow: 0 4px 15px rgba(94, 196, 189, 0.4);
        }

        .nav-btn.admin {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .nav-btn.admin:hover {
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .video-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 0;
        }

        #mainVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            visibility: visible;
            opacity: 1;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* overlay sits above video and allows header/controls to receive clicks */
            pointer-events: auto;
            z-index: 50;
        }

            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;

            justify-content: space-between;

            font-weight: 600;

            background: #5ec4bd;

            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            pointer-events: auto;
        }

            border: 2px solid rgba(255, 255, 255, 0.4);
            padding: 12px 24px;

            font-size: 16px;
            font-weight: 600;
            font-family: 'Rubik', sans-serif;

            font-weight: 600;

                transform: scale(0.85);
            }
            100% {

                transform: scale(1);
            }

            0% {

                transform: scale(1);
            }
            100% {

                transform: scale(0.85);

        async function initVideo() {


            const videoPath = videos[selectedMood];


            const videoSource = document.getElementById('videoSource');
            const mainVideo = document.getElementById('mainVideo');




            if (videoSource && mainVideo) {
                // Keep the mood video running continuously behind the quotes.
                mainVideo.autoplay = true;
                mainVideo.loop = true;
                mainVideo.muted = true;
                mainVideo.defaultMuted = true;
                mainVideo.playsInline = true;
                mainVideo.setAttribute('autoplay', '');
                mainVideo.setAttribute('loop', '');
                mainVideo.setAttribute('muted', '');
                mainVideo.setAttribute('playsinline', '');

                const resumeVideo = () => {
                    if (!document.hidden && mainVideo.paused) {
                        mainVideo.play().catch(() => {});
                    }
                };

                // `loop` handles normal playback; these listeners recover from
                // browser pauses and from devices that do not honor loop reliably.
                mainVideo.addEventListener('ended', () => {
                    mainVideo.currentTime = 0;
                    resumeVideo();
                });
                mainVideo.addEventListener('pause', resumeVideo);
                mainVideo.addEventListener('canplay', resumeVideo);
                document.addEventListener('visibilitychange', resumeVideo);

                const setPlayableSource = async (path) => {
                    if (videoObjectUrl) URL.revokeObjectURL(videoObjectUrl);

                    videoSource.removeAttribute('src');
                    if (window.MOOD_VIDEOS && window.MOOD_VIDEOS[path]) {
                        const binary = atob(window.MOOD_VIDEOS[path]);
                        const bytes = new Uint8Array(binary.length);
                        for (let index = 0; index < binary.length; index++) {
                            bytes[index] = binary.charCodeAt(index);
                        }
                        videoObjectUrl = URL.createObjectURL(
                            new Blob([bytes], { type: 'video/mp4' })
                        );
                        mainVideo.src = videoObjectUrl;
                    } else {
                        throw new Error(`Embedded video is unavailable for ${path}`);
                    }
                    mainVideo.load();
                    await mainVideo.play();
                };

                try {
                    await setPlayableSource(videoPath);
                } catch (error) {
                    console.warn('Mood video failed; loading the available fallback.', error);
                    await setPlayableSource(fallbackVideo);
                }

            } else {
                console.error('Video elements not found!');
            }
        }

        function startQuotes() {
            const base = moodQuotes[selectedMood] || moodQuotes.neutral;
            let cycle = [];
            let idx = 0;

            const shuffle = (arr) => arr
                .map(v => ({ v, r: Math.random() }))
                .sort((a, b) => a.r - b.r)
                .map(o => o.v);

            const ensureCycle = () => {
                if (idx >= cycle.length) {
                    cycle = shuffle(base.slice());
                    idx = 0;
                }
            };

            const spawnOne = () => {
                ensureCycle();
                const quote = cycle[idx++];
                createBubble(quote);
            };

            // בועה ראשונה מיד בכניסה לדף
            spawnOne();
            
            // אחרי 5 שניות - בועה שנייה
            const timer1 = setTimeout(() => {
                spawnOne();
            }, 5000);
            quoteTimers.push(timer1);
            
            // התחל לופ רגיל שמוסיף בועה כל 8 שניות (לנצח!)
            const loop = () => {
                spawnOne();
                const timer = setTimeout(loop, 8000);
                quoteTimers.push(timer);
            };
            
            // התחל את הלופ אחרי 10 שניות
            const timer2 = setTimeout(loop, 10000);
            quoteTimers.push(timer2);
        }

        // פונקציה לבדוק אם מיקום מסוים אינו חופף לבועות קיימות
        function isPositionValid(top, left, width, height) {
            for (let pos of activeBubblePositions) {
                // בדיקת חפיפה (overlap)
                const horizontalOverlap = Math.abs(left - pos.left) < (width + pos.width) / 2 + 50;
                const verticalOverlap = Math.abs(top - pos.top) < (height + pos.height) / 2 + 50;
                
                if (horizontalOverlap && verticalOverlap) {
                    return false; // יש חפיפה
                }
            }
            return true; // אין חפיפה - מיקום תקין
        }

        function createBubble(text) {
            const bubble = document.createElement('div');
            bubble.className = 'quote-bubble';
            
            // בוחרים גודל מתוך 5 אפשרויות
            const sizes = ['extra-small', 'small', 'medium', 'large', 'extra-large'];
            const sizeWeights = [0.15, 0.25, 0.30, 0.20, 0.10]; // הסתברות לכל גודל
            
            let rand = Math.random();
            let selectedSize = 'medium';
            let cumulative = 0;
            
            for (let i = 0; i < sizes.length; i++) {
                cumulative += sizeWeights[i];
                if (rand <= cumulative) {
                    selectedSize = sizes[i];
                    break;
                }
            }
            
            bubble.classList.add(selectedSize);
            bubble.textContent = text;
            
            // מיקום קבוע על כל המסך - הבועות לא זזות!
            const positions = [
                { top: '10%', left: '8%' },
                { top: '15%', right: '12%' },
                { top: '25%', left: '15%' },
                { top: '30%', right: '8%' },
                { top: '40%', left: '50%', transform: 'translateX(-50%)' },
                { top: '45%', left: '10%' },
                { top: '50%', right: '15%' },
                { top: '60%', left: '20%' },
                { top: '65%', right: '10%' },
                { top: '70%', left: '50%', transform: 'translateX(-50%)' },
                { top: '75%', left: '12%' },
                { top: '80%', right: '18%' },
                { top: '20%', left: '35%' },
                { top: '55%', right: '30%' },
                { top: '35%', left: '70%' }
            ];
            
            // בוחרים מיקום אקראי
            const position = positions[Math.floor(Math.random() * positions.length)];
            
            if (position.top) bubble.style.top = position.top;
            if (position.left) bubble.style.left = position.left;
            if (position.right) bubble.style.right = position.right;
            if (position.transform) bubble.style.transform = position.transform;
            
            // אנימציה עדינה להופעה בהדרגה - ממש יפה!
            bubble.style.animation = 'fadeInBubble 2s ease-out forwards';
            
            quotesContainer.appendChild(bubble);
            activeBubbles++;

            // אנימציה להיעלמות אחרי 10 שניות (יפה!)
            const fadeOutTimer = setTimeout(() => {
                bubble.style.animation = 'fadeOutBubble 2s ease-in forwards';
            }, 10000);
            bubbleTimers.push(fadeOutTimer);

            // הסרה סופית אחרי 12 שניות
            const removeTimer = setTimeout(() => {
                bubble.remove();
                activeBubbles--;
            }, 12000);
            bubbleTimers.push(removeTimer);
        }

        // פונקציה לעדכון מספר העגלה כל הזמן
        function updateCartCountContinuously() {
            // בדיקה אם המשתמש מחובר
            const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
            const cartCountEl = document.getElementById('cartCount');
            
            if (!currentUser) {
                // לא מחובר - הסתר ספרה
                if (cartCountEl) {
                    cartCountEl.style.display = 'none';
                }
                return;
            }
            
            // עצירת אינטרוול קודם
            if (cartCountInterval) {
                clearInterval(cartCountInterval);
            }
            
            // עדכון ראשוני
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartCount = document.getElementById('cartCount');
            if (cartCount) {
                cartCount.textContent = totalItems;
                cartCount.style.display = totalItems > 0 ? 'flex' : 'none';
            }
            
            // עדכון כל 2 שניות
            cartCountInterval = setInterval(() => {
                // עדכון מספר על המעגלה באופן רציף
                const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || 'null');
                if (!currentUser) {
                    stopCartCountUpdate();
                    return;
                }
                
                const cart = JSON.parse(localStorage.getItem('cart') || '[]');
                const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

                if (cartCount) {
                    cartCount.textContent = totalItems;
                    cartCount.style.display = totalItems > 0 ? 'flex' : 'none';
                }
            }, 2000);
        }
        
        // עצירת עדכון העגלה
        function stopCartCountUpdate() {
            if (cartCountInterval) {
                clearInterval(cartCountInterval);
                cartCountInterval = null;
            }
        }
        
        // הפעלת עדכון רציף
        updateCartCountContinuously();
